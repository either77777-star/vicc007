<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行繪本手帳</title>
<meta name="theme-color" content="#FFFCF6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6;
  --ink:#3E3A39;
  --coral:#F2A497;
  --yellow:#F6D27A;
  --water:#A8D3E6;
  --bamboo:#B9DAA5;
  --sky:#E6F2F7;
  --line:3px solid var(--ink);
  --r-lg:28px;
  --r-md:18px;
  --r-sm:999px;
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.6;
  padding-top:calc(var(--nav-h) + env(safe-area-inset-top));
}
a{color:inherit}
button{font:inherit;color:inherit}
svg{display:block}

/* ---------- 頂端選單 ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--paper);border-bottom:var(--line);
  padding-top:env(safe-area-inset-top);
}
.nav-inner{
  max-width:640px;margin:0 auto;height:var(--nav-h);
  display:flex;align-items:center;gap:8px;padding:0 12px;
  overflow-x:auto;scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none}
.nav a{
  flex:0 0 auto;text-decoration:none;
  padding:6px 14px;border:var(--line);border-radius:var(--r-sm);
  background:var(--paper);font-size:15px;white-space:nowrap;
  transition:transform .15s;
}
.nav a:active{transform:scale(.95)}
.nav a.on{background:var(--yellow)}

main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
section{scroll-margin-top:calc(var(--nav-h) + 16px);margin-bottom:36px}

.card{
  background:var(--paper);border:var(--line);border-radius:var(--r-lg);
  padding:18px;
}
.sec-title{
  display:flex;align-items:center;gap:10px;
  font-size:22px;margin-bottom:14px;
}
.sec-title .badge{
  width:42px;height:42px;border:var(--line);border-radius:50%;
  display:grid;place-items:center;flex:0 0 auto;
}
.sec-sub{font-size:14px;margin:-8px 0 14px 52px;opacity:.75}

/* ---------- 首頁 ---------- */
.hero{padding:0;overflow:hidden}
.hero-art{background:var(--sky);border-bottom:var(--line)}
.hero-art svg{width:100%;height:auto}
.hero-body{padding:18px 18px 20px;text-align:center}
.hero-tag{
  display:inline-block;padding:2px 12px;border:var(--line);border-radius:var(--r-sm);
  background:var(--bamboo);font-size:14px;margin-bottom:8px;
}
.hero h1{font-size:30px;line-height:1.3;letter-spacing:1px}
.hero .date{margin-top:4px;font-size:16px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.count div{
  border:var(--line);border-radius:var(--r-md);padding:8px 4px;
}
.count div:nth-child(1){background:var(--coral)}
.count div:nth-child(2){background:var(--yellow)}
.count div:nth-child(3){background:var(--water)}
.count div:nth-child(4){background:var(--bamboo)}
.count b{display:block;font-size:28px;font-weight:400;line-height:1.2;font-variant-numeric:tabular-nums}
.count span{font-size:13px}
.count-note{margin-top:12px;font-size:14px}
.weather{
  display:flex;gap:10px;align-items:center;justify-content:center;
  margin-top:14px;font-size:14px;
}

/* ---------- 航班 ---------- */
.flights{display:grid;gap:14px}
.flight{position:relative;overflow:hidden}
.flight .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{
  display:inline-block;padding:2px 12px;border:2.5px solid var(--ink);border-radius:var(--r-sm);
  font-size:14px;line-height:1.5;
}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.route .end{text-align:center}
.route .code{font-size:34px;line-height:1.1;letter-spacing:2px}
.route .time{font-size:20px}
.route .city{font-size:13px}
.route .mid{width:110px}
.flight .meta{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;
  border-top:2.5px dashed var(--ink);padding-top:12px;font-size:13px;text-align:center;
}
.flight .meta b{display:block;font-size:16px;font-weight:400}

/* ---------- 每日行程 ---------- */
.days{
  display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 6px;
  scrollbar-width:none;
}
.days::-webkit-scrollbar{display:none}
.day-btn{
  flex:0 0 auto;min-width:72px;border:var(--line);border-radius:var(--r-md);
  background:var(--paper);padding:6px 10px;text-align:center;cursor:pointer;
  transition:transform .15s;
}
.day-btn small{display:block;font-size:12px}
.day-btn b{display:block;font-size:20px;font-weight:400;line-height:1.2}
.day-btn[aria-selected="true"]{background:var(--coral);transform:translateY(-3px)}
.day-btn:active{transform:scale(.94)}

.day-panel .banner{
  display:flex;align-items:center;gap:12px;
  background:var(--sky);border:var(--line);border-radius:var(--r-md);
  padding:10px 14px;margin-bottom:16px;
}
.day-panel .banner svg{flex:0 0 auto;width:64px;height:64px}
.day-panel .banner h3{font-size:19px;font-weight:400;line-height:1.35}
.day-panel .banner p{font-size:13px}

.timeline{list-style:none;position:relative;padding-left:26px}
.timeline::before{
  content:"";position:absolute;left:8px;top:8px;bottom:8px;
  border-left:3px dashed var(--ink);
}
.tl{position:relative;margin-bottom:14px}
.tl::before{
  content:"";position:absolute;left:-26px;top:16px;width:14px;height:14px;
  border:var(--line);border-radius:50%;background:var(--paper);
}
.tl.must::before{background:var(--coral)}
.tl .box{border:var(--line);border-radius:var(--r-md);padding:10px 14px;background:var(--paper)}
.tl.must .box{background:#FDEEEA}
.tl .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .t{font-size:15px;font-variant-numeric:tabular-nums}
.tl .h4{display:block;font-size:17px;margin-top:2px}
.tl .pp{display:block;font-size:14px;margin-top:2px}
.tl .top{display:flex}
.tag{
  display:inline-block;padding:0 10px;border:2px solid var(--ink);border-radius:var(--r-sm);
  font-size:13px;line-height:1.7;
}
.tag.plane{background:var(--water)}
.tag.train{background:var(--bamboo)}
.tag.metro{background:#D7ECC9}
.tag.bus{background:var(--yellow)}
.tag.walk{background:#FBD9D2}
.tag.taxi{background:var(--paper)}
.must-badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:0 10px;border:2px solid var(--ink);border-radius:var(--r-sm);
  background:var(--coral);font-size:13px;line-height:1.7;
}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:13px}

/* ---------- 清單 ---------- */
.list{list-style:none;display:grid;gap:8px}
.check{
  display:flex;align-items:flex-start;gap:12px;cursor:pointer;
  border:2.5px solid var(--ink);border-radius:var(--r-md);padding:10px 12px;background:var(--paper);
  transition:background .2s;
}
.check input{position:absolute;opacity:0;pointer-events:none}
.check .box{
  flex:0 0 auto;width:26px;height:26px;border:var(--line);border-radius:9px;
  display:grid;place-items:center;background:var(--paper);margin-top:1px;
}
.check .box svg{opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s}
.check input:checked + .box{background:var(--bamboo)}
.check input:checked + .box svg{opacity:1;transform:scale(1)}
.check input:checked ~ .txt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.check input:focus-visible + .box{outline:3px solid var(--water);outline-offset:2px}
.check .txt small{display:block;font-size:13px}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.bar{flex:1;height:16px;border:var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;width:0;background:var(--yellow);border-right:3px solid var(--ink);transition:width .35s}
.bar i.zero{border-right:0}
.group-title{font-size:17px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.group-title::before{content:"";width:12px;height:12px;border:2.5px solid var(--ink);border-radius:50%;background:var(--dot,var(--coral))}

/* ---------- 住宿 ---------- */
.hotels{display:grid;gap:14px}
.hotel{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start}
.hotel .pic{border:var(--line);border-radius:var(--r-md);background:var(--sky);overflow:hidden}
.hotel h3{font-size:18px;font-weight:400;line-height:1.35}
.hotel dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin-top:6px}
.hotel dt{opacity:.7}
.hotel .btn{
  display:inline-block;margin-top:10px;padding:4px 14px;border:var(--line);border-radius:var(--r-sm);
  background:var(--water);text-decoration:none;font-size:14px;
}

.sub-title{font-size:19px;margin:24px 0 10px}

footer{text-align:center;font-size:13px;padding:10px 16px 30px}
footer svg{margin:0 auto 8px}
.motion-toggle{
  margin-top:10px;border:var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:4px 14px;font-size:14px;cursor:pointer;
}

/* ---------- 動畫 ---------- */
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(14px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ride{from{transform:translateX(-190px)}to{transform:translateX(380px)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(0,-5px) rotate(4deg)}}
@keyframes pop{
  0%{opacity:0;transform:translateY(14px) scale(.92)}
  55%{opacity:1;transform:translateY(-6px) scale(1.03)}
  75%{transform:translateY(2px) scale(.99)}
  100%{opacity:1;transform:none}
}
.a-drift{animation:drift 5s ease-in-out infinite alternate}
.a-drift.slow{animation-duration:7s;animation-delay:-2s}
.a-bob{animation:bob 3s ease-in-out infinite}
.a-sway{animation:sway 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.a-spin{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
.a-ride{animation:ride 13s linear infinite}
.a-fly{animation:fly 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bounce > *{animation:pop .55s cubic-bezier(.3,1.4,.5,1) both}
.bounce > *:nth-child(2){animation-delay:.05s}
.bounce > *:nth-child(3){animation-delay:.1s}
.bounce > *:nth-child(4){animation-delay:.15s}
.bounce > *:nth-child(5){animation-delay:.2s}
.bounce > *:nth-child(6){animation-delay:.25s}
.bounce > *:nth-child(7){animation-delay:.3s}
.bounce > *:nth-child(n+8){animation-delay:.35s}
.banner.bounce-one{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}

/* 減少動態效果：跟隨系統設定，也可手動切換 */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
  .a-ride{transform:translateX(70px)}
}
html.reduce{scroll-behavior:auto}
html.reduce *,html.reduce *::before,html.reduce *::after{animation:none !important;transition:none !important}
html.reduce .a-ride{transform:translateX(70px)}

@media (min-width:560px){
  .hero h1{font-size:36px}
  .flights{grid-template-columns:1fr}
}

/* ---------- 編輯功能 ---------- */
.add-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  border:3px dashed var(--ink);border-radius:var(--r-md);background:var(--paper);
  padding:10px;font-size:16px;cursor:pointer;margin-top:12px;
}
.add-btn:active{transform:scale(.98)}
.edit-btn{
  border:2.5px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);
  padding:2px 12px;font-size:14px;cursor:pointer;flex:0 0 auto;
}
.edit-btn.big{padding:5px 16px;font-size:15px;background:var(--yellow);margin-top:14px}
.empty{
  border:3px dashed var(--ink);border-radius:var(--r-lg);padding:18px;text-align:center;font-size:15px;
}
.empty small{display:block;font-size:13px;margin-top:2px}
.flight .head{gap:8px}
.flight .head .right{display:flex;align-items:center;gap:8px}
.day-btn.plus{min-width:56px;border-style:dashed;font-size:26px;line-height:1}
.banner .grow{flex:1;min-width:0}
.banner .acts{display:flex;flex-direction:column;gap:6px}
.tl .box{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.tl .box:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.tl .edit-hint{margin-left:auto;font-size:12px;opacity:.6}
.list li{display:flex;gap:6px;align-items:stretch}
.list li .check{flex:1;min-width:0}
.list li .edit-btn{border-radius:var(--r-md);padding:0 10px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0}
.add-row button{
  border:var(--line);border-radius:var(--r-md);background:var(--bamboo);padding:0 16px;cursor:pointer;font-size:15px;
}
.empty-line{font-size:14px;opacity:.65;padding:4px 2px}
.hero .sub{font-size:16px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tools button,.tools label{
  border:var(--line);border-radius:var(--r-sm);background:var(--paper);
  padding:4px 14px;font-size:14px;cursor:pointer;
}
.tools input{display:none}

input[type=text],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;min-height:44px;
}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--water);outline-offset:1px}

dialog{
  border:var(--line);border-radius:var(--r-lg);background:var(--paper);color:var(--ink);
  padding:0;width:min(560px,calc(100% - 24px));max-height:88vh;margin:auto;
}
dialog[open]{animation:pop .4s cubic-bezier(.3,1.4,.5,1) both}
dialog::backdrop{background:rgba(62,58,57,.35)}
dialog form{display:flex;flex-direction:column;max-height:88vh}
.ed-head{padding:14px 18px;border-bottom:var(--line);font-size:19px;background:var(--yellow)}
.ed-body{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;grid-column:span 2;border:0;min-width:0}
.fld.half{grid-column:span 1}
.fld legend{margin-bottom:4px}
.fld .hint{font-size:12px;opacity:.65}
.fld-row{display:flex;align-items:center;gap:10px;font-size:15px;grid-column:span 2;cursor:pointer}
.fld-row input{width:22px;height:22px;accent-color:var(--coral)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .tag{font-size:15px;padding:2px 12px;opacity:.45}
.chip input:checked + .tag{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.chip input:focus-visible + .tag{outline:3px solid var(--water);outline-offset:2px}
.ed-foot{display:flex;gap:8px;padding:12px 18px;border-top:var(--line)}
.ed-foot button{
  border:var(--line);border-radius:var(--r-sm);padding:6px 16px;font-size:15px;cursor:pointer;background:var(--paper);
}
.ed-foot .save{background:var(--bamboo);margin-left:auto}
.ed-foot .del{background:var(--coral)}
.flight .fnote{margin-top:12px;border-top:2.5px dashed var(--ink);padding-top:10px;font-size:14px;white-space:pre-line}
.share-card{margin-top:14px;border:var(--line);border-radius:var(--r-md);padding:12px;background:var(--sky);text-align:center}
.share-card p{font-size:14px}
.share-card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.share-card button{border:var(--line);border-radius:var(--r-sm);padding:5px 16px;background:var(--yellow);cursor:pointer;font-size:15px}
.share-card input{margin-top:8px;font-size:13px}
.share-banner{
  position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 8px);z-index:40;
  border:var(--line);border-radius:var(--r-md);background:var(--yellow);padding:10px 14px;margin-bottom:14px;font-size:15px;
}
.share-banner .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.share-banner button{border:2.5px solid var(--ink);border-radius:var(--r-sm);padding:3px 14px;background:var(--paper);cursor:pointer;font-size:14px}
.share-banner button.yes{background:var(--bamboo)}
.share-msg{font-size:13px;margin-top:6px;min-height:1em}
</style>
</head>
<body>

<nav class="nav" aria-label="主選單">
  <div class="nav-inner">
    <a href="#home" class="on">首頁</a>
    <a href="#flight">航班</a>
    <a href="#plan">每日行程</a>
    <a href="#todo">待辦・住宿</a>
    <a href="#before">出發前</a>
    <a href="#pack">行李</a>
  </div>
</nav>

<main>
<div class="share-banner" id="share-banner" hidden>
  <div>這是同伴分享給你的行程。</div>
  <div class="row">
    <button type="button" class="yes" id="share-keep">存到我的手機</button>
    <button type="button" id="share-dismiss">只看，不存</button>
  </div>
</div>

<!-- ============ 首頁 ============ -->
<section id="home">
  <div class="card hero">
    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 360 250" role="img">
        <!-- 太陽 -->
        <g class="a-spin">
          <g stroke="#3E3A39" stroke-width="3" stroke-linecap="round">
            <line x1="298" y1="14" x2="298" y2="22"/><line x1="298" y1="88" x2="298" y2="96"/>
            <line x1="257" y1="55" x2="265" y2="55"/><line x1="331" y1="55" x2="339" y2="55"/>
            <line x1="269" y1="26" x2="275" y2="32"/><line x1="321" y1="78" x2="327" y2="84"/>
            <line x1="327" y1="26" x2="321" y2="32"/><line x1="275" y1="78" x2="269" y2="84"/>
          </g>
        </g>
        <circle cx="298" cy="55" r="22" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
        <circle cx="291" cy="52" r="2.2" fill="#3E3A39"/><circle cx="305" cy="52" r="2.2" fill="#3E3A39"/>
        <path d="M292 60 Q298 65 304 60" fill="none" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="286" cy="59" r="3" fill="#F2A497"/><circle cx="310" cy="59" r="3" fill="#F2A497"/>

        <!-- 雲 -->
        <g class="a-drift">
          <path d="M40 58 Q28 58 30 48 Q32 40 42 42 Q46 30 60 32 Q72 28 76 40 Q88 40 86 50 Q86 58 78 58 Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <g class="a-drift slow">
          <path d="M176 36 Q166 36 168 28 Q170 22 178 24 Q182 14 194 16 Q204 13 207 23 Q217 23 215 31 Q215 36 208 36 Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
        </g>

        <!-- 山 -->
        <path d="M-4 196 Q50 140 120 182 Q190 128 270 172 Q320 150 364 168 V250 H-4 Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
        <path d="M150 160 Q162 150 172 156" fill="none" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M300 160 Q310 154 318 158" fill="none" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 五重塔 -->
        <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round">
          <line x1="105" y1="88" x2="105" y2="52"/>
          <circle cx="105" cy="78" r="3.5" fill="#F6D27A"/>
          <circle cx="105" cy="69" r="3.5" fill="#F6D27A"/>
          <circle cx="105" cy="60" r="3.5" fill="#F6D27A"/>
          <rect x="85" y="196" width="40" height="18" fill="#F2A497"/>

function blank(){
  return {trip:{title:"",dest:"",start:"",end:"",depart:"",note:""},
          flights:[], days:[], hotels:[],
          lists:{todo:[], before:[], pack:[]}};
}
function normalize(d){
  const b = blank();
  if(!d || typeof d !== "object") return b;
  b.trip = Object.assign(b.trip, d.trip || {});
  ["flights","days","hotels"].forEach(k=>{ if(Array.isArray(d[k])) b[k] = d[k]; });
  b.days.forEach(day=>{ if(!Array.isArray(day.items)) day.items = []; });
  if(d.lists) ["todo","before","pack"].forEach(k=>{ if(Array.isArray(d.lists[k])) b.lists[k] = d.lists[k]; });
  return b;
}
let data = blank();
try{ data = normalize(JSON.parse(localStorage.getItem(STORE) || "null")); }catch(e){ data = blank(); }
let previewMode = false;   // 正在看分享連結裡的行程，還沒存

  if(previewMode) return;

}

/* ---------- 分享連結：把行程壓縮後放進網址 # 後面 ---------- */
function b64urlFromBytes(bytes){
  let s = ""; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function bytesFromB64url(str){
  const b = atob(str.replace(/-/g,"+").replace(/_/g,"/"));
  const out = new Uint8Array(b.length); for(let i=0;i<b.length;i++) out[i] = b.charCodeAt(i); return out;
}
async function encodeTrip(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
    return "z" + b64urlFromBytes(new Uint8Array(buf));
  }
  return "j" + b64urlFromBytes(raw);
}
async function decodeTrip(code){
  const kind = code[0], bytes = bytesFromB64url(code.slice(1));
  let text;
  if(kind === "z"){
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    text = new TextDecoder().decode(buf);
  }else text = new TextDecoder().decode(bytes);
  return normalize(JSON.parse(text));
}
function shareMsg(t){ document.getElementById("share-msg").textContent = t; }

const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dash = s => s ? esc(s) : "—";
function parseDate(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function fmtMD(s){ const d = parseDate(s); return d ? `${d.getMonth()+1}/${d.getDate()}` : ""; }
function fmtWeek(s){ const d = parseDate(s); return d ? "週" + WEEK[d.getDay()] : ""; }
function fmtFull(s){ const d = parseDate(s); return d ? `${d.getFullYear()} / ${d.getMonth()+1} / ${d.getDate()}（${WEEK[d.getDay()]}）` : ""; }
function addDays(s, n){ const d = parseDate(s); if(!d) return ""; d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const byDate = (a,b) => (a.date||"9999").localeCompare(b.date||"9999");
const byTime = (a,b) => (a.t||"99:99").localeCompare(b.t||"99:99");

/* ===================== 編輯視窗 ===================== */
const dlg = document.getElementById("editor");
const edForm = document.getElementById("ed-form");
const edBody = document.getElementById("ed-body");
let edState = null;

function fieldHTML(f, v){
  const id = "f-" + f.k;
  const half = f.half ? " half" : "";
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "";
  if(f.type === "chips"){
    const arr = Array.isArray(v) ? v : [];
    return `<fieldset class="fld"><legend>${f.l}</legend><div class="chips">${
      Object.entries(TAG).map(([k,l])=>`<label class="chip"><input type="checkbox" name="${f.k}" value="${k}" ${arr.includes(k)?"checked":""}><span class="tag ${k}">${l}</span></label>`).join("")
    }</div></fieldset>`;
  }
  if(f.type === "check"){
    return `<label class="fld-row"><input type="checkbox" name="${f.k}" ${v?"checked":""}><span>${f.l}</span></label>`;
  }
  if(f.type === "select"){
    return `<label class="fld${half}" for="${id}">${f.l}<select id="${id}" name="${f.k}">${
      f.options.map(o=>`<option value="${esc(o.v)}" ${o.v===v?"selected":""}>${esc(o.l)}</option>`).join("")
    }</select>${hint}</label>`;
  }
  if(f.type === "textarea"){
    return `<label class="fld" for="${id}">${f.l}<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||"")}">${esc(v||"")}</textarea>${hint}</label>`;
  }
  return `<label class="fld${half}" for="${id}">${f.l}<input id="${id}" name="${f.k}" type="${f.type||"text"}"${/Code$/.test(f.k)?' autocapitalize="characters"':''} value="${esc(v||"")}" placeholder="${esc(f.ph||"")}" autocomplete="off">${hint}</label>`;
}

function openEditor(opts){
  edState = opts;
  document.getElementById("ed-title").textContent = opts.title;
  edBody.innerHTML = opts.fields.map(f=>fieldHTML(f, (opts.values||{})[f.k])).join("");
  document.getElementById("ed-del").hidden = !opts.onDelete;
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
  const first = edBody.querySelector("input:not([type=checkbox]),select,textarea");
  if(first && window.matchMedia("(pointer:fine)").matches) first.focus();
}
function closeEditor(){ if(dlg.close) dlg.close(); else dlg.removeAttribute("open"); edState = null; }

edForm.addEventListener("submit", e=>{
  e.preventDefault();
  if(!edState) return;
  const vals = {};
  edState.fields.forEach(f=>{
    if(f.type === "chips") vals[f.k] = [...edForm.querySelectorAll(`input[name="${f.k}"]:checked`)].map(x=>x.value);
    else if(f.type === "check") vals[f.k] = edForm.querySelector(`[name="${f.k}"]`).checked;
    else vals[f.k] = edForm.querySelector(`[name="${f.k}"]`).value.trim();
  });
  edState.onSave(vals);
  save(); renderAll(); closeEditor();
});

document.getElementById("ed-del").addEventListener("click", ()=>{

});

/* ===================== 首頁 ===================== */
function renderHero(){
  const t = data.trip;
  document.getElementById("hero-title").textContent = t.title || "我的旅行";
  document.getElementById("hero-dest").textContent = t.dest || "";
  const s = parseDate(t.start), e = parseDate(t.end);
  let tag = "我的旅程";
  if(s && e && e >= s){
    const n = Math.round((e - s) / 864e5) + 1;
    tag = n === 1 ? "1 日遊" : `${n} 天 ${n-1} 夜`;
  }
  document.getElementById("hero-tag").textContent = tag;
  document.getElementById("hero-date").textContent =
    s ? (fmtFull(t.start) + (e ? " → " + fmtFull(t.end).replace(/^\d{4} \/ /,"") : "")) : "還沒設定日期";
  const note = document.getElementById("hero-note");
  note.textContent = t.note || "";
  note.hidden = !t.note;
  tickCount();
}

/* ===================== 每日行程 ===================== */
const daysEl = document.getElementById("days");
const panel = document.getElementById("day-panel");
let curDay = null;
try{ curDay = localStorage.getItem(STORE+"-day"); }catch(e){}

function sortedDays(){ return [...data.days].sort(byDate); }
function renderDays(animate){
  const days = sortedDays();
  if(!days.find(d=>d.id===curDay)){
    const today = new Date(); const ts = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    const hit = days.find(d=>d.date===ts);
    curDay = hit ? hit.id : (days[0] ? days[0].id : null);
  }
  daysEl.innerHTML = days.map((d,i)=>`
    <button class="day-btn" role="tab" id="tab-${d.id}" aria-controls="day-panel" aria-selected="${d.id===curDay}" data-day="${d.id}" type="button">
      <small>Day ${i+1}</small><b>${d.date?fmtMD(d.date):"未定"}</b><small>${fmtWeek(d.date)||"&nbsp;"}</small>
    </button>`).join("") +
    `<button class="day-btn plus" type="button" data-act="add-day" aria-label="新增一天">＋</button>`;

  if(!days.length){
    panel.innerHTML = `<div class="empty">還沒有每日行程<small>按上方「＋」新增第一天${data.trip.start?"":"，先在首頁設定出發日會自動帶入日期"}</small></div>`;
    return;
  }
  const idx = days.findIndex(d=>d.id===curDay);
  const d = days[idx];
  panel.setAttribute("aria-labelledby", "tab-"+d.id);
  const items = [...d.items].sort(byTime);
  panel.innerHTML = `
    <div class="banner${animate?" bounce-one":""}">${ART[d.art] || ART.torii}
      <div class="grow"><p>Day ${idx+1}${d.date?"・"+fmtMD(d.date)+"（"+fmtWeek(d.date).slice(1)+"）":""}${d.area?"・"+esc(d.area):""}</p><h3>${esc(d.title) || "這天的主題"}</h3></div>
      <div class="acts"><button class="edit-btn" type="button" data-act="edit-day" data-id="${d.id}">✎ 這天</button></div>
    </div>
    ${items.length ? `<ol class="timeline${animate?" bounce":""}">
      ${items.map(it=>`
        <li class="tl${it.must?" must":""}">
          <button class="box" type="button" data-act="edit-item" data-id="${it.id}">
            <span class="top">
              <span class="t">${esc(it.t) || "--:--"}</span>
              ${(it.tags||[]).map(t=>`<span class="tag ${t}">${TAG[t]||""}</span>`).join("")}
              ${it.must?`<span class="must-badge">★ 必去</span>`:""}
              <span class="edit-hint">✎</span>
            </span>
            <span class="h4">${esc(it.h) || "（未命名）"}</span>
            ${it.p?`<span class="pp">${esc(it.p)}</span>`:""}
          </button>
        </li>`).join("")}
    </ol>` : `<div class="empty">這天還沒有行程</div>`}
    <button class="add-btn" type="button" data-act="add-item">＋ 新增行程</button>`;
}
function selectDay(id){
  curDay = id;
  try{ localStorage.setItem(STORE+"-day", id); }catch(e){}
  renderDays(true);
  const b = document.getElementById("tab-"+id);
  if(b) b.scrollIntoView({block:"nearest", inline:"center", behavior: reduced() ? "auto" : "smooth"});
}
daysEl.addEventListener("keydown", e=>{
  if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  const days = sortedDays(); const cur = days.findIndex(d=>d.id===document.activeElement.dataset.day);
  if(cur<0) return;
  const n = days[(cur + (e.key==="ArrowRight"?1:-1) + days.length) % days.length];
  selectDay(n.id); document.getElementById("tab-"+n.id).focus();
});

/* ===================== 清單 ===================== */
const tick = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="#3E3A39" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function checkItem(list, it){
  return `<li><label class="check"><input type="checkbox" data-list="${list}" data-id="${it.id}" ${it.done?"checked":""}><span class="box">${tick}</span><span class="txt">${esc(it.txt)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</span></label><button class="edit-btn" type="button" data-act="edit-check" data-list="${list}" data-id="${it.id}" aria-label="編輯「${esc(it.txt)}」">✎</button></li>`;

function addRow(list, group, ph){
  return `<form class="add-row" data-list="${list}" data-group="${group||""}"><input type="text" placeholder="${ph}" aria-label="${ph}" enterkeyhint="done"><button type="submit">加入</button></form>`;
}
function renderLists(){
  document.getElementById("list-todo").innerHTML =
    (data.lists.todo.length ? `<ul class="list">${data.lists.todo.map(it=>checkItem("todo",it)).join("")}</ul>` : `<p class="empty-line">還沒有待辦事項，在下方輸入後按「加入」。</p>`) +
    addRow("todo","","新增待辦，例：預約餐廳");
  document.getElementById("list-before").innerHTML =
    (data.lists.before.length ? `<ul class="list">${data.lists.before.map(it=>checkItem("before",it)).join("")}</ul>` : `<p class="empty-line">還沒有項目，在下方輸入後按「加入」。</p>`) +
    addRow("before","","新增項目，例：確認護照效期");
  document.getElementById("list-pack").innerHTML = PACK_GROUPS.map(g=>{
    const items = data.lists.pack.filter(x=>(x.group||"other")===g.k);
    return `<h3 class="group-title" style="--dot:${g.dot}">${g.l}</h3>
      ${items.length ? `<ul class="list">${items.map(it=>checkItem("pack",it)).join("")}</ul>` : ""}
      ${addRow("pack", g.k, "新增到「"+g.l+"」")}`;
  }).join("");
  updateProgress();
}
function updateProgress(){
  ["todo","before","pack"].forEach(k=>{
    const arr = data.lists[k];
    const done = arr.filter(x=>x.done).length;
    const bar = document.getElementById("bar-"+k);
    bar.style.width = arr.length ? (done/arr.length*100)+"%" : "0%";
    bar.classList.toggle("zero", done===0);
    document.getElementById("num-"+k).textContent = arr.length && done===arr.length ? `全部完成 ${done}/${arr.length}` : `${done}/${arr.length}`;
  });
}
document.addEventListener("change", e=>{
  const t = e.target;
  if(!t.dataset || !t.dataset.list || t.type !== "checkbox") return;
  const it = data.lists[t.dataset.list].find(x=>x.id===t.dataset.id);
  if(it){ it.done = t.checked; save(); updateProgress(); }
});
document.addEventListener("submit", e=>{
  const f = e.target.closest(".add-row"); if(!f) return;
  e.preventDefault();
  const input = f.querySelector("input"); const txt = input.value.trim();
  if(!txt){ input.focus(); return; }
  const item = {id:uid(), txt, sub:"", done:false};
  if(f.dataset.list === "pack") item.group = f.dataset.group;
  data.lists[f.dataset.list].push(item);
  save(); renderLists();
  const again = document.querySelector(`.add-row[data-list="${f.dataset.list}"][data-group="${f.dataset.group}"] input`);
  if(again) again.focus();
});

/* ===================== 按鈕動作 ===================== */
const find = (arr, id) => arr.find(x=>x.id===id);
const remove = (arr, id) => { const i = arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1); };

document.addEventListener("click", e=>{
  const dayBtn = e.target.closest("[data-day]");
  if(dayBtn){ selectDay(dayBtn.dataset.day); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const day = find(data.days, curDay);

  if(act === "edit-trip") openEditor({title:"旅程資訊", fields:F_TRIP, values:data.trip,
    onSave:v=>{ Object.assign(data.trip, v); }});

  else if(act === "add-flight"){
    const kind = data.flights.length === 0 ? "去程" : data.flights.length === 1 ? "回程" : "轉機";
    openEditor({title:"新增航班", fields:F_FLIGHT, values:{kind, date: kind==="去程" ? data.trip.start : kind==="回程" ? data.trip.end : ""},
      onSave:v=>{ data.flights.push(Object.assign({id:uid()}, v)); }});
  }
  else if(act === "edit-flight"){ const f = find(data.flights, id);
    openEditor({title:"編輯航班", fields:F_FLIGHT, values:f, onSave:v=>Object.assign(f,v), onDelete:()=>remove(data.flights,id)}); }

  else if(act === "add-day"){
    const days = sortedDays(); const last = days.filter(d=>d.date).pop();
    const date = last ? addDays(last.date, 1) : (data.trip.start || "");
    openEditor({title:"新增一天", fields:F_DAY, values:{date, art:ART_OPTIONS[days.length % 5].v},
      onSave:v=>{ const nd = Object.assign({id:uid(), items:[]}, v); data.days.push(nd); curDay = nd.id; }});
  }
  else if(act === "edit-day" && day){
    openEditor({title:"編輯這一天", fields:F_DAY, values:day, onSave:v=>Object.assign(day,v),
      onDelete:()=>{ remove(data.days, day.id); curDay = null; }});
  }
  else if(act === "add-item" && day){
    openEditor({title:"新增行程", fields:F_ITEM, values:{tags:[]},
      onSave:v=>{ day.items.push(Object.assign({id:uid()}, v)); }});
  }
  else if(act === "edit-item" && day){ const it = find(day.items, id);
    openEditor({title:"編輯行程", fields:F_ITEM, values:it, onSave:v=>Object.assign(it,v), onDelete:()=>remove(day.items,id)}); }

  else if(act === "add-hotel") openEditor({title:"新增住宿", fields:F_HOTEL, values:{},
    onSave:v=>{ data.hotels.push(Object.assign({id:uid()}, v)); }});
  else if(act === "edit-hotel"){ const h = find(data.hotels, id);
    openEditor({title:"編輯住宿", fields:F_HOTEL, values:h, onSave:v=>Object.assign(h,v), onDelete:()=>remove(data.hotels,id)}); }

  else if(act === "edit-check"){ const arr = data.lists[b.dataset.list]; const it = find(arr, id);
    openEditor({title:"編輯項目", fields:F_CHECK, values:it, onSave:v=>{ if(v.txt) Object.assign(it,v); }, onDelete:()=>remove(arr,id)}); }

  else if(act === "export"){
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `旅程備份-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  else if(act === "share"){
    (async ()=>{
      try{
        const code = await encodeTrip(data);
        const url = location.href.split("#")[0] + "#trip=" + code;
        const box = document.getElementById("share-url");
        box.value = url; box.hidden = false;
        let done = false;
        if(navigator.share){
          try{ await navigator.share({title: data.trip.title || "我的旅行", text: "我們的旅行行程", url}); done = true; shareMsg("已開啟分享。"); }
          catch(e){ if(e && e.name === "AbortError"){ shareMsg(""); return; } }
        }
        if(!done){
          try{ await navigator.clipboard.writeText(url); shareMsg("連結已複製，貼到 LINE 傳給同伴就好。"); }
          catch(e){ box.select(); shareMsg("請長按上方連結複製。"); }
        }
      }catch(e){ shareMsg("產生連結失敗，請再試一次。"); }
    })();
  }
  else if(act === "reset"){
    if(confirm("確定要清空所有行程、航班、住宿和清單嗎？建議先匯出備份。")){
      data = blank(); curDay = null; save(); renderAll();
    }
  }
});

document.getElementById("import-file").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = normalize(JSON.parse(r.result));
      if(confirm("匯入後會取代目前的內容，確定嗎？")){ data = d; curDay = null; save(); renderAll(); }
    }catch(err){ alert("檔案格式不對，請選擇從這個頁面匯出的備份檔。"); }
    e.target.value = "";
  };
  r.readAsText(file);
});

/* ===================== 倒數 ===================== */
const pad = n => String(n).padStart(2,"0");
function tickCount(){
  const note = document.getElementById("count-note");
  const set = (d,h,m,s) => { document.getElementById("cd-d").textContent=d; document.getElementById("cd-h").textContent=h; document.getElementById("cd-m").textContent=m; document.getElementById("cd-s").textContent=s; };
  const t = data.trip;
  const target = t.depart ? new Date(t.depart) : (t.start ? parseDate(t.start) : null);
  if(!target || isNaN(target)){ set("--","--","--","--"); note.textContent = "按「編輯旅程資訊」填入起飛時間，就會開始倒數"; return; }
  const now = new Date();
  let ms = target - now;
  if(ms <= 0){
    set("00","00","00","00");
    const end = parseDate(t.end); if(end) end.setHours(23,59,59);
    note.textContent = end && now <= end ? "旅程進行中，玩得開心！" : "旅程結束，歡迎回家！";
    return;
  }
  const d = Math.floor(ms/864e5); ms -= d*864e5;
  const h = Math.floor(ms/36e5);  ms -= h*36e5;
  const m = Math.floor(ms/6e4);   ms -= m*6e4;
  set(d, pad(h), pad(m), pad(Math.floor(ms/1e3)));
  note.textContent = t.depart ? "距離起飛還有" : "距離出發日還有";
}
setInterval(tickCount, 1000);

/* ===================== 選單高亮 ===================== */
const links = [...document.querySelectorAll(".nav a")];
const secs = links.map(a=>document.querySelector(a.getAttribute("href")));
if("IntersectionObserver" in window){
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const i = secs.indexOf(en.target);
        links.forEach((a,j)=>a.classList.toggle("on", j===i));
        links[i].scrollIntoView({block:"nearest", inline:"center", behavior:"auto"});
      }
    });
  }, {rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(s=>io.observe(s));
}

/* ===================== 減少動態效果 ===================== */
const mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
const toggle = document.getElementById("motion-toggle");
let manual = null;
try{ manual = localStorage.getItem(STORE+"-motion"); }catch(e){}
function reduced(){ return document.documentElement.classList.contains("reduce") || (mq && mq.matches); }
function applyMotion(){
  const on = manual === "reduce";
  document.documentElement.classList.toggle("reduce", on);
  const eff = reduced();
  toggle.textContent = "減少動態效果：" + (eff ? "開" : "關") + (mq && mq.matches && !on ? "（跟隨系統）" : "");
  toggle.setAttribute("aria-pressed", eff ? "true" : "false");
}
toggle.addEventListener("click", ()=>{
  manual = manual === "reduce" ? "" : "reduce";
  try{ localStorage.setItem(STORE+"-motion", manual); }catch(e){}
  applyMotion();
});
if(mq && mq.addEventListener) mq.addEventListener("change", applyMotion);
applyMotion();

/* ===================== 開始 ===================== */
function renderAll(){ renderHero(); renderFlights(); renderDays(false); renderHotels(); renderLists(); }
renderAll();

/* 打開分享連結時：先顯示分享的行程，讓對方決定要不要存 */
(async function openShared(){
  const m = /[#&]trip=([A-Za-z0-9_-]+)/.exec(location.hash);
  if(!m) return;
  try{
    const shared = await decodeTrip(m[1]);
    previewMode = true; data = shared; curDay = null; renderAll();
    document.getElementById("share-banner").hidden = false;
  }catch(e){ /* 連結壞了就照常顯示自己的資料 */ }
})();
const clearHash = () => { try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} };
document.getElementById("share-keep").addEventListener("click", ()=>{
  previewMode = false; save(); clearHash();
  document.getElementById("share-banner").hidden = true;
});
document.getElementById("share-dismiss").addEventListener("click", ()=>{
  document.getElementById("share-banner").hidden = true;
});
</script>
